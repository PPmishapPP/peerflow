# Профиль для тестов.
# Параметры подключения НЕ задаются: их подставляет Testcontainers через
# `@ServiceConnection` (см. ru.peerflow.support.PostgresTestBase) —
# в контейнере поднимается настоящий PostgreSQL той же мажорной версии,
# что и на локальной машине разработчика.
spring:
  jpa:
    hibernate:
      # Схему в тестах создаёт Flyway, Hibernate только сверяет сущности.
      ddl-auto: validate
  flyway:
    enabled: true

peerflow:
  storage:
    # Аватары в тестах не должны попадать в рабочую папку проекта.
    root: '${java.io.tmpdir}/peerflow-test-storage'

logging:
  level:
    root: WARN
