# nginx-фрагмент для PeerFlow.
#
# Устанавливается как отдельный файл в /etc/nginx/sites-available/ и
# подключается симлинком в sites-enabled. Отдельный порт 8443 — чтобы не
# трогать существующий server-блок groupdating.ru на 443.
#
# Используется тот же TLS-сертификат demiapp.ru: имя хоста то же, поэтому
# сертификат подходит без новых DNS-записей.
#
# Backend слушает 127.0.0.1:8082 (см. compose.prod.yaml).

server {
    listen 8443 ssl http2;
    server_name demiapp.ru;

    ssl_certificate /etc/letsencrypt/live/demiapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demiapp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Загрузка аватаров: файл до 5 МБ плюс запас на multipart-обёртку.
    client_max_body_size 10m;

    # Весь API PeerFlow -> backend.
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime (SSE, фаза 6): не буферизовать поток и не рвать долгое соединение.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
